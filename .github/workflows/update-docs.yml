name: Update docs to maps-docs repo

on:
  push:
    branches:
      - main

# Each run regenerates the full docs from its maps commit, so only the newest one needs to publish.
concurrency:
  group: update-docs
  cancel-in-progress: true

jobs:
  update_docs:
    name: Update docs on maps-docs repo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps
    steps:
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
        working-directory: /
      - name: test convert
        run: convert -version
        working-directory: /
      - name: Checkout maps repo
        uses: actions/checkout@v4
        with:
          path: maps
      - name: Checkout maps-docs repo
        uses: actions/checkout@v4
        with:
          repository: rnmapbox/maps-docs
          ssh-key: ${{ secrets.MAPS_DOCS_DEPLOY_KEY }}
          path: maps-docs
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Create dummy accesstoken file
        run: echo 'dummytoken' > ./accesstoken
        working-directory: maps/example
      - name: Install dependencies
        run: yarn install
      - name: Generate component docs into maps-docs repo
        run: node scripts/doc-generate.mjs
      - name: Generate example docs into maps-docs repo
        run: bun scripts/example-docs.ts
      - name: Generate example app into maps-docs repo
        run: |
          cd example
          if [ -z "$MAPBOX_WEB_ACCESS_TOKEN" ]; then
            echo "::warning::MAPBOX_WEB_ACCESS_TOKEN is not set, the published example app will have no map tiles"
          fi
          echo "$MAPBOX_WEB_ACCESS_TOKEN" > accesstoken
          # yarn skips postinstall when nothing changed, so write env.json explicitly
          node scripts/set_access_token.js
          npx expo export -p web --output-dir ../../maps-docs/static/example-app
          node scripts/web_route_pages.js ../../maps-docs/static/example-app
        working-directory: maps
        env:
          MAPBOX_WEB_ACCESS_TOKEN: ${{ secrets.MAPBOX_WEB_ACCESS_TOKEN }}
      - name: Setup deploy key for github deploy
        uses: webfactory/ssh-agent@v0.5.0
        with:
          ssh-private-key: ${{ secrets.MAPS_DOCS_DEPLOY_KEY }}
      - name: Add all changed files to git and push to origin main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git log -1
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          MESSAGE="Update docs from maps  rnmapbox/maps@${GITHUB_SHA::7}"
          git commit -q -m "$MESSAGE"
          PUSHED=false
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "Attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
            # Replay our generated files onto the new main instead of rebasing: hashed web bundles
            # make rebases hit rename/rename conflicts, and the export dir is owned by this job.
            GENERATED=$(git rev-parse HEAD)
            BASE=$(git rev-parse HEAD~1)
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            git rm -r -q --ignore-unmatch static/example-app
            git diff --no-renames --name-only --diff-filter=D -z "$BASE" "$GENERATED" | xargs -0 -r git rm -q --ignore-unmatch --
            git diff --no-renames --name-only --diff-filter=d -z "$BASE" "$GENERATED" | xargs -0 -r git checkout "$GENERATED" --
            git checkout "$GENERATED" -- static/example-app
            if git diff --cached --quiet; then
              echo "origin/main already has these docs"
              PUSHED=true
              break
            fi
            git commit -q -m "$MESSAGE"
          done
          if [ "$PUSHED" != "true" ]; then
            echo "All push attempts failed"
            exit 1
          fi
        working-directory: maps-docs
        env:
          GITHUB_SHA: ${{ github.sha }}

