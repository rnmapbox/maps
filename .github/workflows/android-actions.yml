name: Android Build

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        default: default
        type: string
      NVMRC:
        required: true
        type: string
      MAP_IMPL:
        description: "The map implementation to use (mapbox,mapbox11)"
        default: mapbox
        required: false
        type: string
      NEW_ARCH:
        description: "If build with new architecture or not"
        default: false
        required: false
        type: boolean
    secrets:
      MAPBOX_ACCESS_TOKEN:
        required: true
      ENV_MAPBOX_ACCESS_TOKEN:
        required: false

jobs:
  build_example:
    name: Android Example Build ${{ inputs.NEW_ARCH && 'Fabric' || 'Paper' }} ${{ inputs.MAP_IMPL }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node ${{ inputs.NVMRC }}
        uses: actions/setup-node@v3.5.1
        with:
          node-version: ${{ inputs.NVMRC }}

      - name: Setup JDK zulu 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      
      # Fork PRs get no secrets; fall back to the public rotated CI token (see rnmapbox/ci-config)
      - name: Access token
        run: |
          if [ -n "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "$MAPBOX_ACCESS_TOKEN" > ./accesstoken
          else
            curl -fsSL https://raw.githubusercontent.com/rnmapbox/ci-config/main/mapbox-ci-token > ./accesstoken
          fi
        working-directory: example
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN || secrets.ENV_MAPBOX_ACCESS_TOKEN }}

      - run: yarn install --network-timeout 1000000
        working-directory: example

      - run: yarn postinstall
        working-directory: example

      - run: ./gradlew assemble
        working-directory: example/android
        env:
          CI_MAP_IMPL: ${{ inputs.MAP_IMPL }}
          ORG_GRADLE_PROJECT_newArchEnabled: ${{ inputs.NEW_ARCH && 'true' || 'false' }}
