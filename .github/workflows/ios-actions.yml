name: iOS Build & Detox

on:
  workflow_call:
    inputs:
      env_name:
        required: true
        default: default
        type: string
      NVMRC:
        required: true
        type: string
      MAP_IMPL:
        description: "The map implementation to use (mapbox,mapbox11)"
        default: mapbox
        required: false
        type: string
      NEW_ARCH:
        description: "If build with new architecture or not"
        default: false
        required: false
        type: boolean
      SKIP:
        description: "Report the build as skipped, e.g. when only the web implementation changed"
        default: false
        required: false
        type: boolean
      E2E_MODE:
        description: "test: e2e tests and visual snapshots, doc-screenshots: capture the doc site screenshots"
        default: test
        required: false
        type: string
    secrets:
      MAPBOX_ACCESS_TOKEN:
        required: true
      ENV_MAPBOX_ACCESS_TOKEN:
        required: false
      PERCY_TOKEN:
        required: false

jobs:
  report_skipped_build:
    name: iOS Example Build ${{ inputs.NEW_ARCH && 'Fabric' || 'Paper' }} ${{ inputs.MAP_IMPL }}
    if: ${{ inputs.SKIP }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Only src/web changed, so the iOS build is not needed"

  build:
    name: iOS Example Build ${{ inputs.NEW_ARCH && 'Fabric' || 'Paper' }} ${{ inputs.MAP_IMPL }}
    if: ${{ !inputs.SKIP }}
    # arm64 only: Metal in the iOS Simulator is unreliable on -intel runners (actions/runner-images#14836)
    runs-on: macos-26
    timeout-minutes: ${{ inputs.E2E_MODE == 'doc-screenshots' && 120 || 55 }}
    environment: ${{ inputs.env_name }}
    env:
      # Release for the doc screenshots, so they have no "Connect to Metro" banner or LogBox toasts
      DETOX_CONFIGURATION: ${{ inputs.E2E_MODE == 'doc-screenshots' && 'ios.release.ci' || 'ios.debug.ci' }}
      # Read by example/metro.config.js when the build bundles the JS, so docScreenshots.e2e.js can wait for idle maps
      RNMBX_E2E_MAPS_IDLE: ${{ inputs.E2E_MODE == 'doc-screenshots' && '1' || '' }}

    defaults:
      run:
        working-directory: ./example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fork PRs get no secrets; fall back to the public rotated CI token (see rnmapbox/ci-config)
      - name: Access Token
        run: |
          if [ -n "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "$MAPBOX_ACCESS_TOKEN" > ./accesstoken
          else
            "$GITHUB_WORKSPACE/scripts/ci/fetch-mapbox-token.sh" > ./accesstoken
          fi
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN || secrets.ENV_MAPBOX_ACCESS_TOKEN }}

      - name: Setup node ${{ inputs.NVMRC }}
        uses: actions/setup-node@v3.5.1
        with:
          node-version: ${{ inputs.NVMRC }}

      - name: Cache node_modules
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            node_modules
            example/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install Yarn Dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --network-timeout 1000000

      - run: yarn postinstall
        working-directory: example

      - name: Cache Pods
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('**/Podfile.lock') }}-${{ inputs.MAP_IMPL }}-${{ inputs.NEW_ARCH }}}

      - name: Check CocoaPods version
        id: cocoapods-version
        run: |
          pod --version > version.txt
          cat version.txt
          echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Upgrade CocoaPods
        if: steps.cocoapods-version.outputs.version == '1.15.0'
        run: sudo gem install cocoapods -v 1.15.2

      - name: Install Pod Dependencies
        if: steps.pods-cache.outputs.cache-hit != 'true'
        run: cd ios && pod --version && pod update MapboxMaps hermes-engine Turf && pod install
        env:
          CI_MAP_IMPL: ${{ inputs.MAP_IMPL }}
          RCT_NEW_ARCH_ENABLED: ${{ inputs.NEW_ARCH && 1 || 0 }}
          NO_FLIPPER: 1

      - name: Install Detox Dependencies
        run: |
          brew tap wix/brew
          brew trust wix/brew
          for i in 1 2 3; do brew install applesimutils && break; sleep 10; done
          applesimutils --version

      # Detox's postinstall builds this into ~/Library/Detox, which isn't restored with node_modules
      - name: Build Detox framework cache
        if: steps.yarn-cache.outputs.cache-hit == 'true'
        run: yarn detox build-framework-cache

      - name: Build for detox
        run: |
          xcodebuild -version
          set -o pipefail && NSUnbufferedIO=YES  yarn detox build --configuration "$DETOX_CONFIGURATION" 2>&1

      - name: Boot simulator
        run: |
          UDID=$("$GITHUB_WORKSPACE/scripts/ci/pick-ios-simulator.sh")
          echo "DETOX_DEVICE_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          time xcrun simctl bootstatus "$UDID"

      - name: Test with detox
        if: inputs.E2E_MODE == 'test'
        run: |
          npx detox --version
          yarn detox test --configuration ios.debug.ci --take-screenshots failing --record-logs failing --capture-view-hierarchy enabled e2e/firstTest.e2e.js

      # Informational only, the snapshots are compared by the percy job
      - name: Capture visual snapshots
        if: ${{ !cancelled() && inputs.E2E_MODE == 'test' }}
        continue-on-error: true
        run: yarn detox test --configuration ios.debug.ci e2e/visual.e2e.js

      - name: Store visual snapshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.E2E_MODE == 'test' }}
        with:
          name: visual-snapshots
          path: example/e2e/artifacts/visual
          if-no-files-found: ignore

      # Leaves time in the job timeout to upload what was captured
      - name: Capture doc screenshots
        if: inputs.E2E_MODE == 'doc-screenshots'
        timeout-minutes: 90
        run: yarn detox test --configuration ios.release.ci e2e/docScreenshots.e2e.js
        env:
          DOCSITE_ROOT_PATH: ${{ runner.temp }}/maps-docs
          PERCY_DOC_SCREENSHOTS_DIR: ${{ runner.temp }}/percy-doc-screenshots

      - name: Store doc screenshots
        uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.E2E_MODE == 'doc-screenshots' }}
        with:
          name: doc-screenshots
          path: ${{ runner.temp }}/maps-docs/examples-screenshots
          if-no-files-found: ignore

      - name: Store Percy doc screenshots
        uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.E2E_MODE == 'doc-screenshots' }}
        with:
          name: percy-doc-screenshots
          path: ${{ runner.temp }}/percy-doc-screenshots
          if-no-files-found: ignore

      # e2e/environment.js has already captured the runner state at the moment a test failed
      - name: Collect simulator diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p artifacts/diagnostics/crash-reports
          cp ~/Library/Logs/DiagnosticReports/RNMapboxExample* artifacts/diagnostics/crash-reports/ 2>/dev/null || true
          uptime > artifacts/diagnostics/uptime.txt
          /usr/bin/log show --last 15m --style compact --predicate 'process == "CoreSimulatorService" OR process == "simctl"' \
            > artifacts/diagnostics/host-coresimulator.log 2>&1 || true
          if [ -n "$DETOX_DEVICE_UDID" ]; then
            xcrun simctl spawn "$DETOX_DEVICE_UDID" log show --last 15m --style compact \
              --predicate 'process == "RNMapboxExample" OR process == "SpringBoard"' \
              > artifacts/diagnostics/simulator.log 2>&1 || true
          fi

      - name: Store Detox artifacts on test failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: detox-artifacts-attempt-${{ github.run_attempt }}
          path: example/artifacts
          retention-days: 14

  percy:
    name: Percy visual snapshots
    needs: build
    # Informational: never fails CI, and runs only where the secret is available
    # (pushes to main, same-repo PRs, manual runs) so PR builds compare with main.
    if: >-
      !cancelled() && !inputs.SKIP && inputs.E2E_MODE == 'test' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check for PERCY_TOKEN
        id: token
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: |
          if [ -n "$PERCY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "PERCY_TOKEN is not set, skipping the Percy upload"
          fi

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        with:
          name: visual-snapshots
          path: visual

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: ${{ inputs.NVMRC }}

      - name: Upload to Percy
        if: steps.token.outputs.present == 'true' && hashFiles('visual/*.png') != ''
        continue-on-error: true
        run: npx --yes @percy/cli@1.32.11 upload --strip-extensions visual
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          PERCY_BRANCH: ${{ github.head_ref || github.ref_name }}
          PERCY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PERCY_PULL_REQUEST: ${{ github.event.pull_request.number }}
          PERCY_TARGET_BRANCH: main
          PERCY_CLIENT_ERROR_LOGS: false
